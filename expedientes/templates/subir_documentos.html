<h2>Subir Documentos para {{ estudiante.nombre }}</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  {% if form.errors %}
    <ul style="color:red;">
      {% for field, errors in form.errors.items %}
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      {% endfor %}
    </ul>
  {% endif %}
  <button type="submit">Subir</button>
</form>
