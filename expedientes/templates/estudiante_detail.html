<h2>{{ object.nombre }} ({{ object.matricula }})</h2>
<h3>Documentos:</h3>
<ul>
{% for doc in object.documentos.all %}
  <li><a href="{{ doc.archivo.url }}">{{ doc.archivo.name }}</a></li>
{% empty %}
  <li>No hay documentos</li>
{% endfor %}
</ul>

<a href="{% url 'subir_documentos' object.pk %}">Subir Documentos</a>
<a href="{% url 'expediente_list' %}">Volver</a>
